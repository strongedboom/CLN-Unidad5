name: CI Business Logic
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Lint (Ruff)
        run: python -m ruff check src tests
      - name: Pruebas + cobertura (mínimo 80%)
        run: python -m pytest -v --cov=src --cov-report=term-missing --cov-report=html --cov-fail-under=80
      - name: Build (compileall)
        run: python -m compileall -q src
      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: htmlcov
          path: htmlcov/
